name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: default

jobs:
  test:
    name: build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge --version
      - run: forge fmt --check
      # Sizes of deployables only. The generic-call lifecycle suite compiles the
      # protocol's SyndicateGovernor and SyndicateVault, which deploy under
      # Robinhood's 98,304-byte limit but exceed EIP-170's 24,576, the limit
      # --sizes enforces. sherwood-protocol's CI skips test files for the same
      # reason. `forge test` below still compiles and runs every suite.
      - run: forge build --sizes --skip test
      # Fork suites are named `*Fork` and run in their own job.
      - run: forge test --no-match-contract Fork -vvv

  fork:
    name: fork tests (Robinhood 4663)
    runs-on: ubuntu-latest
    needs: test
    env:
      # Public RPC: no secret needed, and the fork suites only read + prank.
      ROBINHOOD_RPC_URL: https://rpc.mainnet.chain.robinhood.com
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test --match-contract Fork -vvv
